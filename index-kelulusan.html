        // ==========================================

            LOGO_URL: "https://cdn-icons-png.flaticon.com/512/330/330999.png",

        // ==========================================
        // UTILITAS UI

        function showLoader(text = "Memproses...") {
            document.getElementById('loaderText').innerText = text;
            document.getElementById('globalLoader').classList.remove('hidden-el');
        }
        function hideLoader() { document.getElementById('globalLoader').classList.add('hidden-el'); }
        
        function showPage(pageId) {
            ['pageLogin', 'areaSiswa', 'areaAdmin'].forEach(id => {
                document.getElementById(id).classList.add('hidden-el');
            });
            document.getElementById(pageId).classList.remove('hidden-el');
        }

        function showAlert(msg) {
            const d = document.createElement('div');
            d.className = "fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-xl z-[99999999] text-sm animate-bounce transition-opacity w-max max-w-[90%]";
            d.innerText = msg;
            document.getElementById('app-wrapper').appendChild(d);
            setTimeout(() => { d.remove(); }, 3000);
        }

        let actionConfirm = null;
        function tampilkanConfirm(pesan, callback) {
            document.getElementById('confirmMessage').innerText = pesan;
            actionConfirm = callback;
            document.getElementById('modalConfirm').classList.remove('hidden-el');
        }
        function tutupConfirm() { document.getElementById('modalConfirm').classList.add('hidden-el'); actionConfirm = null; }
        function eksekusiConfirm() { if(actionConfirm) actionConfirm(); tutupConfirm(); }

        // PWA Functions (Sama persis)
        function initPWA() { /* ... Kode PWA lama ... */ }
        function installPWA() { /* ... Kode PWA lama ... */ }

        // ==========================================
        // FIREBASE BACKEND LOGIC
        // ==========================================

        function updateLoginUI() {
            document.getElementById('loginSekolahName').innerText = globalSettings.NAMA_SEKOLAH;
            if(globalSettings.LOGO_URL) document.getElementById('loginLogo').src = globalSettings.LOGO_URL;
        }

        function fetchSettings() {
            db.collection("pengaturan").doc("global").get().then((doc) => {
                if (doc.exists) {
                    globalSettings = doc.data();
                    updateLoginUI();
                } else {
                    // Buat default jika belum ada
                    db.collection("pengaturan").doc("global").set(globalSettings).then(() => updateLoginUI());
                }
            }).catch(e => showAlert("Gagal memuat pengaturan: " + e.message));
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();
            showLoader("Mencocokkan data...");

            // Cek apakah Admin
            db.collection("admin").doc(u).get().then((adminDoc) => {
                if (adminDoc.exists && adminDoc.data().password === p) {
                    hideLoader();
                    currentUser = { role: 'admin', username: u };
                    initAdmin();
                } else {
                    // Cek apakah Siswa (gunakan NISN sebagai Document ID)
                    db.collection("siswa").doc(u).get().then((siswaDoc) => {
                        hideLoader();
                        if (siswaDoc.exists && siswaDoc.data().Password === p) {
                            currentUser = { role: 'siswa', ...siswaDoc.data() };
                            initSiswa();
                        } else {
                            showAlert("NISN atau Password salah!");
                        }
                    }).catch(e => { hideLoader(); showAlert("Error: " + e.message); });
                }
            }).catch(e => { hideLoader(); showAlert("Error: " + e.message); });
        }

        function logout() {
            currentUser = null;
            if(countdownInterval) clearInterval(countdownInterval);
            document.getElementById('loginForm').reset();
            document.getElementById('profileModal').classList.add('hidden-el');
            showPage('pageLogin');
            updateLoginUI();
        }

        // ==========================================
        // LOGIKA SISWA (Sama Persis)
        // ==========================================
        function initSiswa() {
            showPage('areaSiswa');
            document.getElementById('siswaHeaderSekolah').innerText = globalSettings.NAMA_SEKOLAH;
            document.getElementById('siswaHeaderLogo').src = globalSettings.LOGO_URL || "https://cdn-icons-png.flaticon.com/512/330/330999.png";
            document.getElementById('siswaNama').innerText = currentUser.Nama;
            document.getElementById('siswaNISN').innerText = currentUser.NISN;
            document.getElementById('resTTL').innerText = currentUser.TTL;
            document.getElementById('resNISN').innerText = currentUser.NISN;
            document.getElementById('resNama').innerText = currentUser.Nama;
            
            ['siswaCountdownView', 'siswaReadyView', 'siswaResultView'].forEach(id => document.getElementById(id).classList.add('hidden-el'));
            mulaiPenghitungWaktu();
        }

        function toggleProfileMenu() { document.getElementById('profileModal').classList.toggle('hidden-el'); }

        function mulaiPenghitungWaktu() {
            if(countdownInterval) clearInterval(countdownInterval);
            const targetTime = new Date(globalSettings.WAKTU_PENGUMUMAN).getTime();

            const cekWaktu = () => {
                const now = new Date().getTime();
                const distance = targetTime - now;

                if (distance <= 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('siswaCountdownView').classList.add('hidden-el');
                    document.getElementById('siswaReadyView').classList.remove('hidden-el');
                } else {
                    document.getElementById('siswaReadyView').classList.add('hidden-el');
                    document.getElementById('siswaCountdownView').classList.remove('hidden-el');
                    
                    document.getElementById('tHari').innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                    document.getElementById('tJam').innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                    document.getElementById('tMenit').innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                    document.getElementById('tDetik').innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
                }
            };
            cekWaktu(); 
            countdownInterval = setInterval(cekWaktu, 1000);
        }

        function lihatHasilKelulusan() {
            document.getElementById('siswaReadyView').classList.add('hidden-el');
            document.getElementById('siswaResultView').classList.remove('hidden-el');
            
            const st = currentUser.Status_Kelulusan.toUpperCase();
            const box = document.getElementById('boxStatusLulus');
            const icon = document.getElementById('iconStatus');
            const teks = document.getElementById('textStatusLulus');
            const desc = document.getElementById('descStatusLulus');
            const btnSKL = document.getElementById('boxTombolSKL');

            box.className = "rounded-2xl shadow-sm border p-6 text-center mb-5 text-white transition-all transform scale-100";
            
            if(st === 'LULUS') {
                box.classList.add('bg-green-500', 'border-green-600');
                icon.className = "fas fa-check-circle text-5xl mb-3";
                teks.innerText = "LULUS";
                desc.innerText = "Selamat! Anda dinyatakan Lulus dari sekolah.";
                btnSKL.classList.toggle('hidden-el', !(currentUser.SKL_Tersedia === 'YA' && currentUser.Link_SKL));
            } else if (st === 'TIDAK LULUS') {
                box.classList.add('bg-red-500', 'border-red-600');
                icon.className = "fas fa-times-circle text-5xl mb-3";
                teks.innerText = "TIDAK LULUS";
                desc.innerText = "Tetap semangat dan pantang menyerah.";
                btnSKL.classList.add('hidden-el');
            } else {
                box.classList.add('bg-yellow-500', 'border-yellow-600');
                icon.className = "fas fa-exclamation-circle text-5xl mb-3";
                teks.innerText = "DITUNDA";
                desc.innerText = "Status kelulusan Anda sedang ditinjau.";
                btnSKL.classList.add('hidden-el');
            }
        }

        function bukaLinkSKL() { if(currentUser.Link_SKL) window.open(currentUser.Link_SKL, '_blank'); }

        // ==========================================
        // LOGIKA ADMIN
        // ==========================================
        function initAdmin() {
            showPage('areaAdmin');
            switchAdminTab('Dashboard');
            muatDataAdmin();
            populateAdminSettings();
        }

        function switchAdminTab(tab) {
            document.querySelectorAll('.admin-tab-content').forEach(el => el.classList.add('hidden-el'));
            document.querySelectorAll('.nav-admin-btn').forEach(el => {
                el.classList.remove('text-blue-600');
                el.classList.add('text-gray-400');
            });

            document.getElementById('adminTab' + tab).classList.remove('hidden-el');
            document.getElementById('navAdmin' + tab).classList.remove('text-gray-400');
            document.getElementById('navAdmin' + tab).classList.add('text-blue-600');

            if(tab === 'DataSiswa') renderTabelSiswa(true);
        }

        function muatDataAdmin() {
            showLoader("Memuat data...");
            db.collection("siswa").get().then((querySnapshot) => {
                hideLoader();
                mockDataSiswa = [];
                querySnapshot.forEach((doc) => { mockDataSiswa.push(doc.data()); });
                
                renderStatistikAdmin(mockDataSiswa);
                if(!document.getElementById('adminTabDataSiswa').classList.contains('hidden-el')){
                    renderTabelSiswa(true);
                }
            }).catch(e => { hideLoader(); showAlert("Gagal memuat data: " + e.message); });
        }

        function renderStatistikAdmin(data) {
            document.getElementById('statTotal').innerText = data.length;
            document.getElementById('statLulus').innerText = data.filter(x => x.Status_Kelulusan === 'LULUS').length;
            document.getElementById('statTidak').innerText = data.filter(x => x.Status_Kelulusan === 'TIDAK LULUS').length;
            document.getElementById('statTunda').innerText = data.filter(x => x.Status_Kelulusan === 'DITUNDA').length;
        }

        function handleSearchSiswa() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => { renderTabelSiswa(true); }, 300); 
        }

        function renderTabelSiswa(resetPage = false) {
            if (resetPage) currentPageSiswa = 1;

            const list = document.getElementById('listDataSiswa');
            const k = document.getElementById('searchSiswa').value.toLowerCase();
            
            const filtered = mockDataSiswa.filter(x => x.Nama.toLowerCase().includes(k) || x.NISN.toLowerCase().includes(k));
            
            if(filtered.length === 0) {
                list.innerHTML = `<div class="text-center p-5 text-gray-500 text-sm">Tidak ada data ditemukan.</div>`;
                return;
            }

            const endIndex = currentPageSiswa * limitPerHalaman;
            const dataToRender = filtered.slice(0, endIndex);
            let htmlHTML = "";

            dataToRender.forEach((s) => {
                let badge = s.Status_Kelulusan === 'LULUS' ? "bg-green-100 text-green-700" : (s.Status_Kelulusan === 'TIDAK LULUS' ? "bg-red-100 text-red-700" : "bg-yellow-100 text-yellow-700");
                let sklIco = s.SKL_Tersedia === 'YA' ? '<i class="fas fa-file-pdf text-indigo-500 ml-2"></i>' : '';
                const safeNISN = s.NISN.toString().replace(/'/g, "\\'");

                htmlHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center mb-3">
                        <div class="overflow-hidden pr-2">
                            <div class="font-bold text-gray-800 text-sm truncate">${s.Nama} ${sklIco}</div>
                            <div class="text-xs text-gray-500">${s.NISN}</div>
                            <div class="text-[10px] px-2 py-0.5 rounded inline-block mt-1 ${badge}">${s.Status_Kelulusan}</div>
                        </div>
                        <button onclick="bukaModalSiswa('${safeNISN}')" class="shrink-0 w-8 h-8 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center hover:bg-blue-100 transition">
                            <i class="fas fa-pen text-xs"></i>
                        </button>
                    </div>`;
            });

            if (filtered.length > endIndex) {
                htmlHTML += `<button onclick="loadMoreSiswa()" class="w-full py-3 mt-2 bg-blue-50 text-blue-600 rounded-xl text-sm font-bold shadow-sm border border-blue-100">Muat Lebih Banyak Data</button>`;
            }
            list.innerHTML = htmlHTML;
        }

        function loadMoreSiswa() { currentPageSiswa++; renderTabelSiswa(false); }

        function bukaModalSiswa(nisn) {
            document.getElementById('modalFormSiswa').classList.remove('hidden-el');
            document.getElementById('formSiswa').reset();
            document.getElementById('wrapLinkSKL').classList.add('hidden-el');

            let data = nisn ? mockDataSiswa.find(x => x.NISN === nisn) : null;

            if(data) {
                document.getElementById('modalSiswaTitle').innerText = "Edit Data Siswa";
                document.getElementById('btnHapusSiswa').classList.remove('hidden-el');
                document.getElementById('fId').value = data.NISN; 
                document.getElementById('fNISN').value = data.NISN;
                // Kunci form NISN saat edit, karena Firebase pakai NISN sbg ID Dokumen
                document.getElementById('fNISN').readOnly = true; 
                document.getElementById('fNISN').classList.add('bg-gray-100');

                document.getElementById('fPassword').value = data.Password || "";
                document.getElementById('fNama').value = data.Nama;
                document.getElementById('fTTL').value = data.TTL;
                document.getElementById('fStatus').value = data.Status_Kelulusan;
                
                if(data.SKL_Tersedia === 'YA') {
                    document.getElementById('fSKL_Tersedia').checked = true;
                    document.getElementById('wrapLinkSKL').classList.remove('hidden-el');
                    document.getElementById('fLinkSKL').value = data.Link_SKL;
                }
            } else {
                document.getElementById('modalSiswaTitle').innerText = "Tambah Siswa Baru";
                document.getElementById('btnHapusSiswa').classList.add('hidden-el');
                document.getElementById('fId').value = "";
                document.getElementById('fNISN').readOnly = false;
                document.getElementById('fNISN').classList.remove('bg-gray-100');
            }
        }

        function tutupModalSiswa() { document.getElementById('modalFormSiswa').classList.add('hidden-el'); }

        function toggleLinkSKL() {
            const chk = document.getElementById('fSKL_Tersedia').checked;
            document.getElementById('wrapLinkSKL').classList.toggle('hidden-el', !chk);
            if(!chk) document.getElementById('fLinkSKL').value = "";
        }

        function simpanSiswa(e) {
            e.preventDefault();
            const fNISN = document.getElementById('fNISN').value;
            const payload = {
                NISN: fNISN,
                Password: document.getElementById('fPassword').value,
                Nama: document.getElementById('fNama').value,
                TTL: document.getElementById('fTTL').value,
                Status_Kelulusan: document.getElementById('fStatus').value,
                SKL_Tersedia: document.getElementById('fSKL_Tersedia').checked ? 'YA' : 'TIDAK',
                Link_SKL: document.getElementById('fLinkSKL').value || ""
            };

            showLoader("Menyimpan ke Firestore...");
            // Firebase menggunakan NISN sebagai ID Dokumen agar tidak ada data ganda
            db.collection("siswa").doc(fNISN).set(payload).then(() => {
                hideLoader();
                tutupModalSiswa();
                muatDataAdmin(); 
                showAlert("Data berhasil disimpan!");
            }).catch(e => { hideLoader(); showAlert("Gagal: " + e.message); });
        }

        function hapusSiswa() {
            const nisn = document.getElementById('fId').value;
            tampilkanConfirm(`Yakin ingin menghapus data siswa dengan NISN ${nisn}?`, () => {
                showLoader("Menghapus...");
                db.collection("siswa").doc(nisn).delete().then(() => {
                    hideLoader();
                    tutupModalSiswa();
                    muatDataAdmin();
                    showAlert("Data terhapus.");
                }).catch(e => { hideLoader(); showAlert("Gagal: " + e.message); });
            });
        }

        function populateAdminSettings() {
            document.getElementById('setNamaSekolah').value = globalSettings.NAMA_SEKOLAH;
            document.getElementById('setLogo').value = globalSettings.LOGO_URL;
            try {
                const dt = new Date(globalSettings.WAKTU_PENGUMUMAN);
                document.getElementById('setWaktu').value = new Date(dt.getTime() - (dt.getTimezoneOffset() * 60000)).toISOString().slice(0,16);
            } catch(e){}
        }

        function simpanPengaturan(e) {
            e.preventDefault();
            const payload = {
                NAMA_SEKOLAH: document.getElementById('setNamaSekolah').value,
                LOGO_URL: document.getElementById('setLogo').value,
                WAKTU_PENGUMUMAN: new Date(document.getElementById('setWaktu').value).toISOString()
            };

            showLoader("Menyimpan pengaturan...");
            db.collection("pengaturan").doc("global").set(payload).then(() => {
                hideLoader();
                globalSettings = payload;
                showAlert("Pengaturan disimpan!");
            }).catch(e => { hideLoader(); showAlert("Gagal: " + e.message); });
        }

        function prosesImportExcel(e) {
            e.preventDefault();
            const file = document.getElementById('fileExcel').files[0];
            if (!file) return showAlert("Pilih file Excel!");

            showLoader("Membaca File Excel...");
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {defval: ""});

                    if(jsonData.length === 0) { hideLoader(); return showAlert("File kosong!"); }
                    if(!("NISN" in jsonData[0])) { hideLoader(); return showAlert("Format tidak sesuai!"); }

                    kirimDataImportFirebase(jsonData);
                } catch (err) { hideLoader(); showAlert("Error: " + err.message); }
            };
            reader.readAsArrayBuffer(file);
        }

        function kirimDataImportFirebase(jsonData) {
            showLoader("Menyimpan Batch ke Firebase...");
            let batch = db.batch();
            let count = 0;
            let commitPromises = [];

            jsonData.forEach((row) => {
                let nisnStr = String(row.NISN).trim();
                if(!nisnStr) return;

                let docRef = db.collection("siswa").doc(nisnStr);
                batch.set(docRef, {
                    NISN: nisnStr,
                    Password: (row.Password !== undefined && row.Password !== "") ? String(row.Password) : nisnStr,
                    Nama: row.Nama || "-",
                    TTL: row.TTL || "-",
                    Status_Kelulusan: row.Status_Kelulusan || "DITUNDA",
                    SKL_Tersedia: row.SKL_Tersedia || "TIDAK",
                    Link_SKL: row.Link_SKL || ""
                });
                
                count++;
                // Firebase batch limit is 500 operations
                if (count === 490) {
                    commitPromises.push(batch.commit());
                    batch = db.batch();
                    count = 0;
                }
            });

            if (count > 0) commitPromises.push(batch.commit());

            Promise.all(commitPromises).then(() => {
                hideLoader();
                tutupModalImport();
                muatDataAdmin();
                showAlert("Berhasil mengimpor " + jsonData.length + " data!");
            }).catch(e => { hideLoader(); showAlert("Gagal Import: " + e.message); });
        }
    </script>
